trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:

- stage: Validate
  displayName: Terraform Validate

  jobs:
  - job: ValidateTerraform

    steps:
    - checkout: self

    - task: AzureKeyVault@2
      inputs:
        azureSubscription: 'azure-terraform-connection'
        KeyVaultName: 'hubspoke-kv'
        SecretsFilter: '*'
        RunAsPreJob: true

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.9.0'

    - task: TerraformTaskV4@4
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/hub-spoke-TF'
        backendServiceArm: 'azure-terraform-connection'
        backendAzureRmResourceGroupName: 'Tr-2.0-ResourceGroup'
        backendAzureRmStorageAccountName: 'debstorageaccountbackend'
        backendAzureRmContainerName: 'newtfstate'
        backendAzureRmKey: 'dev.terraform.tfstate'

    - task: TerraformTaskV4@4
      displayName: Terraform Validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/hub-spoke-TF'

- stage: Plan
  displayName: Terraform Plan
  dependsOn: Validate

  jobs:
  - job: TerraformPlan

    steps:
    - checkout: self

    - task: AzureKeyVault@2
      inputs:
        azureSubscription: 'azure-terraform-connection'
        KeyVaultName: 'hubspoke-kv'
        SecretsFilter: '*'
        RunAsPreJob: true

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.9.0'

    - task: TerraformTaskV4@4
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/hub-spoke-TF'
        backendServiceArm: 'azure-terraform-connection'
        backendAzureRmResourceGroupName: 'Tr-2.0-ResourceGroup'
        backendAzureRmStorageAccountName: 'debstorageaccountbackend'
        backendAzureRmContainerName: 'newtfstate'
        backendAzureRmKey: 'dev.terraform.tfstate'

    - task: TerraformTaskV4@4
      displayName: Terraform Plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/hub-spoke-TF'
        environmentServiceNameAzureRM: 'azure-terraform-connection'
        commandOptions: >
          -var="admin_username=$(admin-username)"
          -var="admin_password=$(admin-password)"
          -var="admin_public_ip=$(admin-public-ip)"
          -var="public_key=$(public-key)"

- stage: Apply
  displayName: Terraform Apply
  dependsOn: Plan

  jobs:
  - deployment: TerraformApply
    displayName: Terraform Apply Deployment

    environment: prod

    pool:
      vmImage: ubuntu-latest

    strategy:
      runOnce:
        deploy:

          steps:
          - checkout: self

          - task: AzureKeyVault@2
            inputs:
              azureSubscription: 'azure-terraform-connection'
              KeyVaultName: 'hubspoke-kv'
              SecretsFilter: '*'
              RunAsPreJob: true

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: '1.9.0'

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/hub-spoke-TF'
              backendServiceArm: 'azure-terraform-connection'
              backendAzureRmResourceGroupName: 'Tr-2.0-ResourceGroup'
              backendAzureRmStorageAccountName: 'debstorageaccountbackend'
              backendAzureRmContainerName: 'newtfstate'
              backendAzureRmKey: 'dev.terraform.tfstate'

          - task: TerraformTaskV4@4
            displayName: Terraform Apply
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/hub-spoke-TF'
              environmentServiceNameAzureRM: 'azure-terraform-connection'
              commandOptions: >
                -auto-approve
                -var="admin_username=$(admin-username)"
                -var="admin_password=$(admin-password)"
                -var="admin_public_ip=$(admin-public-ip)"
                -var="public_key=$(public-key)"

