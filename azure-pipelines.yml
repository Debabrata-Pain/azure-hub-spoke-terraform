trigger:
- main
parameters:
- name: environment
  displayName: Select Environment
  type: string
  default: dev

  values:
  - dev
  - uat
  - prod

pool:
  vmImage: ubuntu-latest

stages:

# =========================
# VALIDATE STAGE
# =========================
- stage: Validate
  displayName: Terraform Validate

  jobs:
  - job: ValidateTerraform

    steps:

    - template: .azuredevops/templates/terraform-init.yml

      parameters:
        environment: ${{ parameters.environment }}

    - task: TerraformTaskV4@4
      displayName: Terraform Validate

      inputs:
        provider: 'azurerm'
        command: 'validate'

        workingDirectory: '$(System.DefaultWorkingDirectory)'

# =========================
# PLAN STAGE
# =========================
- stage: Plan
  displayName: Terraform Plan

  dependsOn: Validate

  jobs:
  - job: TerraformPlan

    steps:

    - template: .azuredevops/templates/terraform-plan.yml

      parameters:
        environment: ${{ parameters.environment }}

# =========================
# APPLY STAGE
# =========================
- stage: Apply
  displayName: Terraform Apply

  dependsOn: Plan

  jobs:
  - deployment: TerraformApply

    environment: ${{ parameters.environment }}

    strategy:
      runOnce:
        deploy:

          steps:

          - template: .azuredevops/templates/terraform-apply.yml

            parameters:
              environment: ${{ parameters.environment }}