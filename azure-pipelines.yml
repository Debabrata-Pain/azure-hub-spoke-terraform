trigger:
- main

pool:
  vmImage: ubuntu-latest

parameters:
- name: environment
  displayName: Select Environment
  type: string
  default: dev

  values:
  - dev
  - uat
  - prod

variables:
  terraformVersion: '1.9.8'

stages:

- stage: TerraformDeploy

  displayName: Deploy to ${{ parameters.environment }}

  jobs:
  - deployment: TerraformDeployment

    environment: ${{ parameters.environment }}

    strategy:
      runOnce:
        deploy:

          steps:

          # FETCH SECRETS
          - task: AzureKeyVault@2
            inputs:
              azureSubscription: 'azure-terraform-connection'
              KeyVaultName: 'hubspoke-kv'
              SecretsFilter: '*'
              RunAsPreJob: true

          # INSTALL TERRAFORM
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)

          # TERRAFORM INIT
          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'

              workingDirectory: '$(System.DefaultWorkingDirectory)'

              backendServiceArm: 'azure-terraform-connection'
              backendAzureRmResourceGroupName: 'Tr-2.0-ResourceGroup'
              backendAzureRmStorageAccountName: 'debstorageaccountbackend'
              backendAzureRmContainerName: 'newtfstate'

              backendAzureRmKey: '${{ parameters.environment }}.tfstate'

          # TERRAFORM VALIDATE
          - task: TerraformTaskV4@4
            displayName: Terraform Validate
            inputs:
              provider: 'azurerm'
              command: 'validate'

              workingDirectory: '$(System.DefaultWorkingDirectory)'

          # TERRAFORM PLAN
          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'

              workingDirectory: '$(System.DefaultWorkingDirectory)'

              environmentServiceNameAzureRM: 'azure-terraform-connection'

              commandOptions: >
                -var-file="${{ parameters.environment }}.tfvars"
                -var="admin_username=$(admin-username)"
                -var="admin_password=$(admin-password)"
                -var="admin_public_ip=$(admin-public-ip)"
                -var="public_key=$(public-key)"

          # TERRAFORM APPLY
          - task: TerraformTaskV4@4
            displayName: Terraform Apply
            inputs:
              provider: 'azurerm'
              command: 'apply'

              workingDirectory: '$(System.DefaultWorkingDirectory)'

              environmentServiceNameAzureRM: 'azure-terraform-connection'

              commandOptions: >
                -auto-approve
                -var-file="${{ parameters.environment }}.tfvars"
                -var="admin_username=$(admin-username)"
                -var="admin_password=$(admin-password)"
                -var="admin_public_ip=$(admin-public-ip)"
                -var="public_key=$(public-key)"