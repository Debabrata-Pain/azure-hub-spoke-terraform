trigger:
- main
parameters:
- name: environment
  displayName: Select Environment
  type: string
  default: dev

  values:
  - dev
  - uat
  - prod

pool:
  vmImage: ubuntu-latest

stages:

# =========================
# VALIDATE STAGE
# =========================
- stage: Validate
  displayName: Terraform Validate

  jobs:
  - job: ValidateTerraform

    steps:

    - template: .azuredevops/templates/terraform-init.yml

      parameters:
        environment: ${{ parameters.environment }}

    - task: TerraformTaskV4@4
      displayName: Terraform Validate

      inputs:
        provider: 'azurerm'
        command: 'validate'

        workingDirectory: '$(System.DefaultWorkingDirectory)'


# =========================
# STAGE - SECURITY SCAN
# =========================

- stage: SecurityScan

  displayName: Checkov Security Scan

  dependsOn: Validate

  jobs:

  - job: CheckovScan

    displayName: Run Checkov Scan

    pool:
      vmImage: ubuntu-latest

    steps:

    - checkout: self

    - script: |

        pip install checkov

      displayName: Install Checkov

    - script: |

        checkov -d . --skip-check CKV_AZURE_220 --skip-check CKV_AZURE_50 --skip-check CKV_AZURE_120 --skip-check CKV_AZURE_31

      displayName: Run Checkov Scan

# =========================
# PLAN STAGE
# =========================
- stage: Plan
  displayName: Terraform Plan

  dependsOn: SecurityScan

  jobs:
  - job: TerraformPlan

    steps:

    - template: .azuredevops/templates/terraform-plan.yml

      parameters:
        environment: ${{ parameters.environment }}

# =========================
# APPLY STAGE
# =========================
- stage: Apply
  displayName: Terraform Apply

  dependsOn: Plan

  jobs:
  - deployment: TerraformApply

    environment: ${{ parameters.environment }}

    strategy:
      runOnce:
        deploy:

          steps:

          - template: .azuredevops/templates/terraform-apply.yml

            parameters:
              environment: ${{ parameters.environment }}