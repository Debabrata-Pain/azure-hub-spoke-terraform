trigger:
- main

pool:
  vmImage: ubuntu-latest

parameters:
- name: environment
  type: string
  default: dev
  values:
  - dev
  - uat
  - prod

steps:

- checkout: self

- task: AzureKeyVault@2
  inputs:
    azureSubscription: 'azure-terraform-connection'
    KeyVaultName: 'hubspoke-kv'
    SecretsFilter: '*'
    RunAsPreJob: true

# INSTALL TERRAFORM MANUALLY
- bash: |
    wget https://releases.hashicorp.com/terraform/1.9.0/terraform_1.9.0_linux_amd64.zip
    unzip terraform_1.9.0_linux_amd64.zip
    sudo mv terraform /usr/local/bin/
    terraform version
  displayName: Install Terraform

# TERRAFORM INIT
- bash: |
    cd hub-spoke-TF

    terraform init \
      -backend-config="storage_account_name=debstorageaccountbackend" \
      -backend-config="container_name=newtfstate" \
      -backend-config="key=${{ parameters.environment }}.tfstate" \
      -backend-config="resource_group_name=Tr-2.0-ResourceGroup"
  env:
    ARM_USE_OIDC: true
    ARM_CLIENT_ID: $(servicePrincipalId)
    ARM_TENANT_ID: $(tenantId)
    ARM_SUBSCRIPTION_ID: $(subscriptionId)
    ARM_OIDC_TOKEN: $(idToken)
  displayName: Terraform Init

# VALIDATE
- bash: |
    - bash: |
    terraform init \
      -backend-config="storage_account_name=debstorageaccountbackend" \
      -backend-config="container_name=newtfstate" \
      -backend-config="key=${{ parameters.environment }}.tfstate" \
      -backend-config="resource_group_name=Tr-2.0-ResourceGroup"
  displayName: Terraform Init

# PLAN
- bash: |
    terraform init \
      -backend-config="storage_account_name=debstorageaccountbackend" \
      -backend-config="container_name=newtfstate" \
      -backend-config="key=${{ parameters.environment }}.tfstate" \
      -backend-config="resource_group_name=Tr-2.0-ResourceGroup"
  displayName: Terraform Init

    terraform plan \
      -var-file="${{ parameters.environment }}.tfvars" \
      -var="admin_username=$(admin-username)" \
      -var="admin_password=$(admin-password)" \
      -var="admin_public_ip=$(admin-public-ip)" \
      -var="public_key=$(public-key)"
  displayName: Terraform Plan

# APPLY
- bash: |
    terraform init \
      -backend-config="storage_account_name=debstorageaccountbackend" \
      -backend-config="container_name=newtfstate" \
      -backend-config="key=${{ parameters.environment }}.tfstate" \
      -backend-config="resource_group_name=Tr-2.0-ResourceGroup"
  displayName: Terraform Init

    terraform apply -auto-approve \
      -var-file="${{ parameters.environment }}.tfvars" \
      -var="admin_username=$(admin-username)" \
      -var="admin_password=$(admin-password)" \
      -var="admin_public_ip=$(admin-public-ip)" \
      -var="public_key=$(public-key)"
  displayName: Terraform Apply